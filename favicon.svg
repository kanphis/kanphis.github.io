<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <!-- The avatar (penguin-sparkle) clipped to a circle for the favicon:
         the full penguin face — navy body, the two eyes, the beak with its
         nostrils, the white belly. The paths are the avatar SVG's own,
         verbatim; the square's corners stay out of the crop. -->
    <defs>
        <clipPath id="crop">
            <circle cx="12" cy="12" r="12"/>
        </clipPath>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000084"/>
            <stop offset="1" stop-color="#000064"/>
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFD100"/>
            <stop offset="1" stop-color="#FF5E4A"/>
        </linearGradient>
    </defs>
    <g clip-path="url(#crop)">
        <rect width="24" height="24" fill="url(#body)"/>
        <ellipse cx="12" cy="15.0" rx="6.9" ry="7.9" fill="#FFFFFF"/>
        <path fill="url(#beak)" d="M 10.7 6.343 A 6 6 0 0 1 13.3 6.343 C 13.72 6.44 13.88 6.76 13.82 7.2 C 13.72 7.87 13.3 8.7 12.45 9.6 Q 12 9.95 11.55 9.6 C 10.7 8.7 10.28 7.87 10.18 7.2 C 10.12 6.76 10.28 6.44 10.7 6.343 Z"/>
        <circle cx="11.35" cy="7.05" r="0.23" fill="#FF5E4A"/>
        <circle cx="12.65" cy="7.05" r="0.23" fill="#FF5E4A"/>
        <circle cx="8.8" cy="5.2" r="1.55" fill="#FFFFFF"/>
        <circle cx="15.2" cy="5.2" r="1.55" fill="#FFFFFF"/>
        <circle cx="8.8" cy="5.2" r="1.05" fill="#000064"/>
        <circle cx="15.2" cy="5.2" r="1.05" fill="#000064"/>
        <circle cx="9.15" cy="4.75" r="0.36" fill="#FFFFFF"/>
        <circle cx="15.55" cy="4.75" r="0.36" fill="#FFFFFF"/>
    </g>
</svg>
