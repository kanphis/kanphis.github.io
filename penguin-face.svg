<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.9777826 0.9777826 4.7492294 4.7492294">
    <!-- The face of penguin.svg (the owner's avatar): the white disc — the
         avatar's belly showing through the body's circular cut-out — with
         the beak on top, its geometry and gradient verbatim. The squares of
         the original stay out so the mark never reads as an inscribed
         square, while the belly keeps its white. -->
